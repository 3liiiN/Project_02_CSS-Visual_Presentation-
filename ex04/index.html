<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Box Model</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<h1>Box Model</h1>
	
	<div class="content-box">
		<p>content-box</p>
		<p>Padding and border are added outside the declared width.</p>
	</div>
	
	<div class="border-box">
		<p>border-box</p>
		<p>Padding and border are included inside the declared width.</p>
	</div>

</body>
</html>
